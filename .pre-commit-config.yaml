# Hooki uruchamiane przy każdym commicie (po `pre-commit install`) i w CI.
# Wersje są przypięte; aktualizacja tylko świadomie: `pre-commit autoupdate` + PR.
repos:
  - repo: local
    hooks:
      - id: check-project-config
        name: Validate project configuration against dataset contract
        entry: python scripts/check_project_config.py
        language: system
        pass_filenames: false
        files: ^(project\.yaml|src/asi_project/datasets\.yaml|scripts/check_project_config\.py|src/asi_project/(config|data)\.py|\.pre-commit-config\.yaml)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
