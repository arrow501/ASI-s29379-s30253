# Konfiguracja projektu zespołu. Ten plik edytuje zespół (Sprint 1).
# Kontrakt datasetów prowadzącej jest w src/asi_project/datasets.yaml — tamtego pliku nie edytujemy.

dataset: bank_marketing

# TODO (S1): typy cech po EDA. Wyłącznie kolumny z ALLOWED FEATURES wybranego datasetu.
features:
  numeric: [age, balance, day, campaign, pdays, previous]
  categorical: [job, marital, education, default, housing, loan, contact, month, poutcome]

split:
  test_size: 0.2
  random_state: 42

paths:
  ci_sample: data/01_raw/sample.csv
  metrics: metrics.json
