# CI sample and outputs isolated from full-data artifacts.
raw_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/sample.csv
  load_args:
    sep: ","

trained_model:
  type: pickle.PickleDataset
  filepath: data/06_models/ci/baseline.pkl

metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/ci/metrics.json
  save_args:
    indent: 2
