# Wspólne środowisko bazowe S1–S3: Python i biblioteki ML.
# Nowa instalacja: conda env create -f environment.yml
# Aktualizacja: conda env update -n asi-ml -f environment.yml --prune
# Następnie aktywuj asi-ml i zainstaluj requirements/preflight-s2.txt,
# requirements/preflight-s3.txt oraz requirements/benchmark-s3.txt z -c constraints.txt.
# Weryfikacja: python scripts/check_env.py --autogluon
name: asi-ml
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip=25.1.1
  - numpy=2.2.6
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - scipy=1.16.0
  - matplotlib=3.10.3
  - pyyaml=6.0.2
  - ipykernel=6.29.5
  - nbformat=5.10.4
  - nbclient=0.10.2
  - pytest=8.3.5
  - pre-commit=4.2.0
